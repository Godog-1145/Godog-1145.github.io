<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转到 tevy-dk.com:8090</title>
    
    <!-- 使用meta标签实现自动跳转 (3秒后跳转) -->
    <meta http-equiv="refresh" content="3;url=http://tevy-dk.com:8090">
    
    <!-- 使用JavaScript实现立即跳转 -->
    <script>
        // 立即跳转到目标地址
        window.location.href = "http://tevy-dk.com:8090";
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .loading {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .countdown {
            font-size: 1rem;
            opacity: 0.8;
        }
        .manual-link {
            margin-top: 1rem;
        }
        .manual-link a {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .manual-link a:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading">正在跳转到 tevy-dk.com:8090...</div>
        <div class="countdown" id="countdown">3秒后自动跳转</div>
        <div class="manual-link">
            <a href="http://tevy-dk.com:8090">立即跳转</a>
        </div>
    </div>
    
    <script>
        // 倒计时显示
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = `${countdown}秒后自动跳转`;
            
            if (countdown <= 0) {
                clearInterval(timer);
                countdownElement.textContent = '正在跳转...';
            }
        }, 1000);
    </script>
</body>
</html>
